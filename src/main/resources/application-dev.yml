spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demo
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

featureflag:
  audit:
    dynamo: false   # true para usar DynamoDB

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    mappings:
      access: read_only