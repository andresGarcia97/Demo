# docker compose up -d --wait

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=demo
      - POSTGRES_PASSWORD=admin
      - POSTGRES_USER=admin
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d demo" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081" ]
      interval: 30s
      timeout: 10s
      retries: 3


  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"
    volumes:
      - ./docker/dynamodb:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal


  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      - dynamodb-local

  # Backend de Apicurio Registry (Modo Memoria)
  apicurio-registry:
    image: apicurio/apicurio-registry:3.1.6
    container_name: apicurio-registry
    ports:
      - "8082:8080"
    environment:
    - QUARKUS_PROFILE=dev
    # Habilitar CORS para permitir que la UI (puerto 8083) hable con el Backend (puerto 8082)
    - QUARKUS_HTTP_CORS=true
    - QUARKUS_HTTP_CORS_ORIGINS=http://localhost:8083
    - QUARKUS_HTTP_CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS,HEAD,PATCH
    - QUARKUS_HTTP_CORS_HEADERS=Content-Type,Authorization,X-Registry-Version

  # Interfaz de Usuario
  apicurio-registry-ui:
    image: apicurio/apicurio-registry-ui:3.1.6
    container_name: apicurio-registry-ui
    ports:
      - "8083:8080"
    environment:
      # Apuntar al backend en localhost (desde la perspectiva del navegador)
      - REGISTRY_API_URL=http://localhost:8082/apis/registry/v3
    depends_on:
      - apicurio-registry

  zookeeper:
    #restart: always
    image: docker.io/bitnami/zookeeper:3.8
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    #restart: always
    image: docker.io/bitnami/kafka:3.3
    ports:
      - "9093:9093"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CLIENT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=CLIENT://:9092,EXTERNAL://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=CLIENT://kafka:9092,EXTERNAL://localhost:9093
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=CLIENT
    depends_on:
      - zookeeper

  conduktor-console:
    image: conduktor/conduktor-console:latest
    container_name: conduktor-console
    ports:
      - "8084:8080"
    environment:
      - CDK_CONSOLE_PORT=8080
      # --- CONFIGURACIÓN DE BASE DE DATOS (OBLIGATORIA) ---
      # Conectamos al servicio 'postgres' que definiste arriba.
      # Usuario: admin, Pass: admin, Host: postgres, Port: 5432, DB: demo
      - CDK_DATABASE_URL=postgresql://admin:admin@postgres:5432/demo?sslmode=disable

      # --- CONEXIÓN A KAFKA ---
      - CDK_CLUSTERS_0_ID=local-kafka
      - CDK_CLUSTERS_0_NAME=Local Kafka
      - CDK_CLUSTERS_0_COLOR=#6A1B9A
      - CDK_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

      # --- CONEXIÓN A APICURIO (Modo Compatibilidad) ---
      - CDK_CLUSTERS_0_SCHEMAREGISTRY_URL=http://apicurio-registry:8080/apis/ccompat/v7
    depends_on:
      kafka:
        condition: service_started
      apicurio-registry:
        condition: service_started
      postgres:
        condition: service_healthy


volumes:
  postgres-data: {}
  redis-data: {}
  dynamodb-data: {}